    ["ws",10],["grpc",9],["tcp",6],["h2",6],["http",5],["xhttp",8],["splithttp",8],["httpupgrade",7],["quic",4],["kcp",3]
  ]);
  const SECURITY_BONUS = new Map([
    ["reality",12],["tls",8],["xtls",8],["none",0],["",0]
  ]);
  const GOOD_PORTS = new Set([443,80,8080,8443,2053,2083,2087,2096,8880]);

  function getProxies(){
    return ["https://corsproxy.io/?", "https://api.allorigins.win/raw?url="];
  }

  async function fetchWithFallback(url){
    try {
      const controller = new AbortController();
      const t = setTimeout(()=>controller.abort(), 5000);
      const res = await fetch(url, {signal: controller.signal, cache:"no-store"});
      clearTimeout(t);
      if(res.ok) return await res.text();
    } catch(_) {}
    const proxies = getProxies();
    for(const p of proxies){
      try {
        const target = p + encodeURIComponent(url);
        const controller = new AbortController();
        const t = setTimeout(()=>controller.abort(), 7000);
        const res = await fetch(target, {signal: controller.signal, cache:"no-store"});
        clearTimeout(t);
        if(res.ok) return await res.text();
      } catch(_) {}
    }
    throw new Error("Failed to fetch: " + url);
  }

  function looksBase64Whole(text){
    const s = (text||"").trim().replace(/\s+/g,"");
    if(s.length < 80) return false;
    return /^[A-Za-z0-9+/=_-]+$/.test(s);
  }

  function safeAtobUnicode(b64){
    const padded = b64 + "=".repeat((4 - (b64.length % 4)) % 4);
    const bin = atob(padded.replace(/-/g,"+").replace(/_/g,"/"));
    try {
      return decodeURIComponent(Array.prototype.map.call(bin, c => "%" + ("00"+c.charCodeAt(0).toString(16)).slice(-2)).join(""));
    } catch(_) { return bin; }
  }

  function extractConfigs(text){
    let full = text || "";
    if(looksBase64Whole(full)){
      try{
        const decoded = safeAtobUnicode(full.trim().replace(/\s+/g,""));
        if(decoded.includes("://")) full += "\n" + decoded;
      }catch(_){}
    }
    const lines = full.split(/\r?\n/);
    for(const line of lines){
      const s = (line||"").trim();
      if(!s) continue;
      if(/^[A-Za-z0-9+/=_-]+$/.test(s) && s.length > 40){
        try{
          const decoded = safeAtobUnicode(s);
          if(decoded.includes("://")) full += "\n" + decoded;
        }catch(_){}
      }
    }
    const re = /(vmess|vless|hysteria2|hy2|trojan|ss|hysteria):\/\/[^\s"'<>]+/gim;
    const m = full.match(re) || [];
    return Array.from(new Set(m.map(x=>x.trim())));
  }

  function normalizeConfig(cfg, remark){
    const low = cfg.toLowerCase();
    if(low.startsWith("vmess://")) return remarkVmess(cfg, remark);
    if(low.startsWith("vless://") || low.startsWith("hysteria2://") || low.startsWith("hy2://") || low.startsWith("trojan://") || low.startsWith("ss://") || low.startsWith("hysteria://")){
      return remarkUrlFragment(cfg, remark);
    }
    return null;
  }

  function remarkUrlFragment(cfg, remark){
    try {
      const i = cfg.indexOf("#");
      const base = (i>=0) ? cfg.slice(0,i) : cfg;
      return base + "#" + encodeURIComponent(remark);
    } catch(_) { return cfg; }
  }

  function remarkVmess(cfg, remark){
    try {
      const payload = cfg.slice("vmess://".length);
      const jsonStr = safeAtobUnicode(payload.trim());
      const obj = JSON.parse(jsonStr);
      obj.ps = remark;
      const out = btoa(unescape(encodeURIComponent(JSON.stringify(obj))))
        .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
      return "vmess://" + out;
    } catch(_) { return null; }
  }

  function portBonus(port){
    if(!port || port <= 0) return -50;
    return GOOD_PORTS.has(port) ? 5 : 0;
  }

  function qdict(qs){
    const p = new URLSearchParams(qs||"");
    const out = {};
    for(const [k,v] of p.entries()){ if(!(k in out)) out[k]=v; }
    return out;
  }

  function vmessKeyScore(cfg){
    try {
      const payload = cfg.slice("vmess://".length);
      const jsonStr = safeAtobUnicode(payload.trim());
      const d = JSON.parse(jsonStr);
      const add = String(d.add||"").trim().toLowerCase();
      const port = parseInt(String(d.port||"0").trim(), 10) || 0;
      const net  = String(d.net||"").trim().toLowerCase() || "tcp";
      const tls  = String(d.tls||"").trim().toLowerCase();
      const key = `vmess|${add}|${port}|${net}`;
      let score = 20 + (TRANSPORT_BONUS.get(net) || 4) + (tls === "tls" ? 10 : 2) + portBonus(port);
      return {key, score, cfg};
    } catch(_) { return null; }
  }

  function vlessKeyScore(cfg){
    try {
      const scheme = cfg.split("://")[0].toLowerCase();
      const fake = "http://" + cfg.slice((scheme + "://").length);
      const u = new URL(fake);
      const host = (u.hostname||"").trim().toLowerCase();
      const port = parseInt(u.port || "0", 10) || 0;
      const q = qdict(u.search);
      const t = (q.type || "tcp").toLowerCase();
      const security = (q.security || "").toLowerCase();
      const key = `${scheme}|${host}|${port}|${t}`;
      let score = 25 + (TRANSPORT_BONUS.get(t) || 4) + (SECURITY_BONUS.get(security) || 2) + portBonus(port);
      return {key, score, cfg};
    } catch(_) { return null; }
  }

  function genericKeyScore(cfg){
    try {
      const scheme = cfg.split("://")[0].toLowerCase();
      const fake = "http://" + cfg.slice((scheme + "://").length);
      const u = new URL(fake);
      const host = (u.hostname||"").trim().toLowerCase();
      const port = parseInt(u.port || "0", 10) || 0;
      const q = qdict(u.search);
      const t = ((q.type || q.mode || "") + "").toLowerCase() || "tcp";
      const key = `${scheme}|${host}|${port}`;
      let score = 15 + (TRANSPORT_BONUS.get(t) || 3) + portBonus(port);
      return {key, score, cfg};
    } catch(_) { return {key: "raw|" + cfg, score: 1, cfg}; }
  }

  function makeKeyScore(cfg){
    const low = cfg.toLowerCase();
    if(low.startsWith("vmess://")) return vmessKeyScore(cfg);
    if(low.startsWith("vless://")) return vlessKeyScore(cfg);
    return genericKeyScore(cfg);
  }

  function parseMetaQuick(cfg){
    const low = cfg.toLowerCase();
    let type = low.split("://")[0], net = "tcp", port = null;
    try {
      if(low.startsWith("vmess://")){
        const d = JSON.parse(safeAtobUnicode(cfg.slice("vmess://".length).trim()));
        net = String(d.net || "tcp").toLowerCase();
        port = parseInt(String(d.port || "0"), 10) || null;
      } else {
        const fake = "http://" + cfg.slice((type + "://").length);
        const u = new URL(fake);
        port = parseInt(u.port || "0", 10) || null;
        const q = qdict(u.search);
        net = String(q.type || q.mode || (q.serviceName ? "grpc" : "tcp")).toLowerCase();
      }
      return {valid:true, type, net, port};
    } catch(_) { return {valid:false, type, net, port}; }
  }

        timerRef.current = null;

  // ================================================================
  // 5. MAIN APP with transitions
  // ================================================================
  function App() {
    const [page, setPage] = useState('launch'); // launch, circuit, filter, scrapper, result
    const [filters, setFilters] = useState({ vless: true, vmess: true, hy2: true, proxy: false });
    const [finalConfigs, setFinalConfigs] = useState([]);
    const [isProcessing, setIsProcessing] = useState(false);
    const [showGetStarted, setShowGetStarted] = useState(false);

    const handleLaunch = () => {
      setPage('circuit');
      setTimeout(() => setPage('filter'), 3000);
    };

    const toggleFilter = (key) => {
      setFilters(prev => ({ ...prev, [key]: !prev[key] }));
    };

    const handleGetStarted = async () => {
      setShowGetStarted(true);
      setPage('scrapper');
      setIsProcessing(true);

      try {
        let rawSource = '';
        if (filters.proxy) {
          const proxyUrl = 'https://raw.githubusercontent.com/shervinofpersia/Config/refs/heads/main/ProxyNg.json';
          try {
            rawSource = await fetchWithFallback(proxyUrl);
          } catch (e) { console.warn('Proxy fetch failed', e); }
        } else {
          rawSource = getDefaultSources();
        }

        let configs = extractConfigs(rawSource);
        const remark = '☬SHΞN™';

        if (!filters.proxy) {
          const rules = {
            protos: new Set(),
            nets: new Set(['ws', 'grpc', 'tcp', 'http']),
            ports: null
          };
          if (filters.vless) rules.protos.add('vless');
          if (filters.vmess) rules.protos.add('vmess');
          if (filters.hy2) { rules.protos.add('hysteria2'); rules.protos.add('hy2'); }

          const bestByKey = new Map();
          for (const c of configs) {
            const norm = normalizeConfig(c, remark);
            if (!norm) continue;
            const meta = parseMetaQuick(norm);
            if (!meta.valid) continue;
            if (rules.protos.size && !rules.protos.has(meta.type)) continue;
            if (rules.nets.size && !rules.nets.has(meta.net)) continue;
            const ks = makeKeyScore(norm);
            if (!ks) continue;
            const prev = bestByKey.get(ks.key);
            if (!prev || ks.score > prev.score) {
              bestByKey.set(ks.key, ks);
            }
          }
          configs = Array.from(bestByKey.values()).sort((a,b)=>b.score-a.score).map(x=>x.cfg);
        } else {
          // proxy: only dedupe
          const unique = new Map();
          for (const c of configs) {
            const norm = normalizeConfig(c, remark);
            if (!norm) continue;
            const ks = makeKeyScore(norm);
            if (!ks) continue;
            if (!unique.has(ks.key)) unique.set(ks.key, ks);
          }
          configs = Array.from(unique.values()).sort((a,b)=>b.score-a.score).map(x=>x.cfg);
        }

        setFinalConfigs(configs);
      } catch (err) {
        console.error(err);
        setFinalConfigs([]);
      } finally {
        setIsProcessing(false);
        setTimeout(() => setPage('result'), 1500);
      }
    };

    const handleCopy = async () => {
      if (!finalConfigs.length) return;
      const text = finalConfigs.join('\n');
      try {
        await navigator.clipboard.writeText(text);
        alert('✅ کپی شد!');
      } catch (_) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        alert('✅ کپی شد!');
      }
    };

    const handleDownload = () => {
      if (!finalConfigs.length) return;
      const blob = new Blob([finalConfigs.join('\n') + '\n'], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `SHEN_Sub_${Date.now()}.txt`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      alert('✅ دانلود شد!');
    };

    const renderPage = () => {
      switch (page) {
        case 'launch':
          return (
            <div className="flex-center" style={{ minHeight:'60vh' }}>
              <ShenLaunchButton onClick={handleLaunch} />
            </div>
          );
        case 'circuit':
          return <CircuitLoader />;
        case 'filter':
          return (
            <div className="flex-center" style={{ minHeight:'60vh', gap:'30px' }}>
              <div className="filter-grid">
                {['VLESS','VMESS','HY2','PROXY'].map(label => {
                  const key = label.toLowerCase();
                  return (
                    <div
                      key={key}
                      className={`filter-item ${filters[key] ? 'active' : ''}`}
                      onClick={() => toggleFilter(key)}
                    >
                      {label}
                    </div>
                  );
                })}
              </div>
              <GetStartedButton onClick={handleGetStarted} isActive={false} />
            </div>
          );
        case 'scrapper':
          return (
            <div className="flex-center" style={{ minHeight:'60vh' }}>
              <ShenScrapperLoader />
              {isProcessing && <p style={{ color:'#aaa', marginTop:20 }}>⏳ در حال پردازش...</p>}
            </div>
          );
        case 'result':
          return (
            <div className="flex-center" style={{ minHeight:'60vh', gap:'30px' }}>
              <FingerprintButton onCopy={handleCopy} onDownload={handleDownload} />
              <div style={{ color:'#aaa', fontSize:'14px', textAlign:'center' }}>
                <p>📋 کلیک = کپی</p>
                <p>📥 نگه‌داشتن = دانلود</p>
                <p style={{ marginTop:10, color:'#60a5fa' }}>تعداد: {finalConfigs.length}</p>
              </div>
            </div>
          );
        default: return null;
      }
    };

    return (
      <div className="page">
        {renderPage()}
      </div>
    );
  }

  ReactDOM.render(<App />, document.getElementById('root'));
</script>
